<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Rambutan-Slicer simplified app icon">
<defs>
<linearGradient id="bg" x1=".12" y1="0" x2=".88" y2="1"><stop stop-color="#23232b"/><stop offset=".6" stop-color="#0e1018"/><stop offset="1" stop-color="#090b12"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6865"/><stop offset=".47" stop-color="#ed0921"/><stop offset="1" stop-color="#8a0619"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2=".85"><stop stop-color="#fe4949"/><stop offset=".55" stop-color="#e40c29"/><stop offset="1" stop-color="#a90224"/></linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdf5d"/><stop offset=".36" stop-color="#ed3b28"/><stop offset="1" stop-color="#b70025"/></linearGradient>
