<linearGradient id="layer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb69f" stop-opacity=".86"/><stop offset=".42" stop-color="#ff4d45" stop-opacity=".92"/><stop offset="1" stop-color="#d90228" stop-opacity=".96"/></linearGradient>
</defs>
<rect x="24" y="24" width="976" height="976" rx="202" fill="url(#bg)" stroke="url(#edge)" stroke-width="28"/>
