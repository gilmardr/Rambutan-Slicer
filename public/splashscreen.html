<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rambutan Slicer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-app-region: drag;
      background: #0a0607;
    }

    /* ── Hero art (1536×1024 source, shown at 3:2) ── */

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .hero {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(1.03);
      animation: heroIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes heroIn {
      to { opacity: 1; transform: scale(1); }
    }

    /* ── Loading swoosh: the red stroke under "Rambutan-Slicer" ──
       Same coordinate space as the art (viewBox 1536×1024), so it sits exactly
       where the original stroke was painted. */

    .loader {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 0.3s ease-out 0.45s forwards;
    }

    .reveal {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: reveal 2.4s cubic-bezier(0.65, 0, 0.35, 1) 0.6s infinite;
    }

    @keyframes reveal {
      0%   { transform: scaleX(0); opacity: 1; }
      55%  { transform: scaleX(1); opacity: 1; }
      82%  { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 0; }
    }

    .sheen {
      transform-box: view-box;
      transform: translateX(-260px);
      animation: sheen 2.4s ease-in-out 0.6s infinite;
    }

    @keyframes sheen {
      0%, 50%  { transform: translateX(-260px); }
      80%, 100% { transform: translateX(1300px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero { animation: none; opacity: 1; transform: none; }
      .reveal { animation: none; transform: scaleX(1); }
      .sheen { animation: none; display: none; }
    }

    /* ── Version ── */

    .version {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.38);
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 0.4s ease-out 0.8s forwards;
      visibility: hidden;
    }
    .version.visible { visibility: visible; }

    /* ── Fade-out on close ── */

    body.fade-out {
      transition: opacity 0.18s ease-out;
      opacity: 0;
    }
  </style>
</head>
<body>

    <img class="hero" id="splashHero" src="/rambutan-splash.gif" data-poster="/splash-hero.jpg" alt="Rambutan Slicer" />

          <stop offset="0.5" stop-color="#ff7a52" />

      </g>

        <rect class="sheen" x="0" y="770" width="220" height="110" fill="url(#sheenFill)" />
      </g>
    </svg>
  </div>

  <!-- Version -->
  <span class="version" id="versionEl"></span>

  <script>
    // The splash GIF loops through a blank first frame. Play its reveal once,
    // then keep the finished artwork visible until the app signals readiness.
    const splashHero = document.getElementById('splashHero');
    const splashPoster = splashHero?.dataset.poster;
    if (splashHero && splashPoster) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        splashHero.src = splashPoster;
      } else {
        window.setTimeout(() => {
          if (!document.body.classList.contains('fade-out')) {
            splashHero.src = splashPoster;
          }
        }, 3150);
      }
    }

    // ── Dynamic version from Tauri ──
    (async () => {
      try {
        const api = window.__TAURI__;
        if (!api) return;
        let version;
        try {
          version = await api.app.getVersion();
        } catch {
          try {
            version = await api.core.invoke('plugin:app|version');
          } catch {}
        }
        if (version) {
          const el = document.getElementById('versionEl');
          el.textContent = 'v' + version;
          el.classList.add('visible');
        }
      } catch {}
    })();

    // ── Graceful exit: fade out before close ──
    (async () => {
      try {
        const api = window.__TAURI__;
        if (!api || !api.event) return;
        await api.event.listen('splash-fade-out', () => {
          document.body.classList.add('fade-out');
        });
      } catch {}
    })();
  </script>
</body>
</html>
