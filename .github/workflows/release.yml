name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Republish even if a release already exists for this version.
          Overwrites its notes and assets. Leave off unless you mean it.
        type: boolean
        default: false
      dry_run:
        description: >-
          Build every package and keep them as workflow artifacts, but create
          no tag and publish no release. Use it to try the builds from a branch.
        type: boolean
        default: false
  push:
    branches:
      - main
      - dev
    paths:
      - package.json
      - package-lock.json
      - src-tauri/**
      - scripts/**
      - flatpak/**
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      release_body: ${{ steps.version.outputs.release_body }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      has_prerelease_suffix: ${{ steps.version.outputs.has_prerelease_suffix }}
      updater_json: ${{ steps.version.outputs.updater_json }}
      publish_updater_json: ${{ steps.version.outputs.publish_updater_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A push of N commits puts github.event.before at HEAD~N, so any
          # fixed depth is a guess. Getting it wrong used to make the version
          # guard below fail open and republish a shipped release.
          fetch-depth: 0

      - name: Detect package version bump
        id: version
        shell: bash
        run: |
          current_version="$(node -p "require('./package.json').version")"
          branch="${{ github.ref_name }}"
          tag_name="v${current_version}"

          # A version carries a prerelease identifier (-rc.1, -beta, ...) when
          # it has a hyphen, per SemVer grammar (MAJOR.MINOR.PATCH-prerelease).
          if [[ "${current_version}" == *-* ]]; then
            has_prerelease_suffix="true"
          else
            has_prerelease_suffix="false"
          fi

          # GitHub's prerelease flag means "not the stable/production channel",
          # not "not yet finished". Only a final (no prerelease id) version on
          # main is the stable channel — every dev-branch build (final or
          # RC/beta of the dev line) and every RC/beta on main is a
          # GitHub prerelease.
          if [[ "$branch" == "main" && "$has_prerelease_suffix" == "false" ]]; then
            is_prerelease="false"
          else
            is_prerelease="true"
          fi

          # Updater feed selection: dev only updates the dev feed on final releases
          # (but it's very unlikely that we ever make those). main only updates the
          # stable feed for a final release — an RC on main is downloadable for
          # testing but never wired to the auto-updater, so stable users can't land on it.
          #
          # Rambutan: the in-app updater stays disabled until the fork has its own
          # signed feed, so the feed is only written when the repository variable
          # UPDATER_FEED_ENABLED is "true" (Settings → Secrets and variables →
          # Actions → Variables). The feed also needs TAURI_SIGNING_PRIVATE_KEY.
          if [[ "${{ vars.UPDATER_FEED_ENABLED }}" != "true" ]]; then
            updater_json=""
            publish_updater_json="false"
          elif [[ "$branch" == "dev" && "$has_prerelease_suffix" == "false" ]]; then
            updater_json="latest-dev.json"
            publish_updater_json="true"
          elif [[ "$branch" == "main" && "$has_prerelease_suffix" == "false" ]]; then
            updater_json="latest.json"
            publish_updater_json="true"
          else
            updater_json=""
            publish_updater_json="false"
          fi

          if [[ "$branch" == "main" ]]; then
            if [[ "$has_prerelease_suffix" == "true" ]]; then
              release_label="Release candidate ${tag_name}"
            else
              release_label="Rambutan Slicer ${tag_name}"
            fi
          else
            release_label="Dev build ${tag_name}"
          fi

          echo "has_prerelease_suffix=${has_prerelease_suffix}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${is_prerelease}" >> "$GITHUB_OUTPUT"
          echo "updater_json=${updater_json}" >> "$GITHUB_OUTPUT"
          echo "publish_updater_json=${publish_updater_json}" >> "$GITHUB_OUTPUT"

          # The release text is this version's section of CHANGELOG.md
          # ("## [x.y.z] ..." up to the next "## ["), when there is one.
          changelog_notes="$(awk -v heading="## [${current_version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          has_changelog_notes=false
          if [[ -n "${changelog_notes//[[:space:]]/}" ]]; then has_changelog_notes=true; fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${current_version}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            echo "release_name=${release_label}" >> "$GITHUB_OUTPUT"
            {
              echo "release_body<<EOF"
              if [[ "$has_changelog_notes" == "true" ]]; then
                printf '%s\n' "$changelog_notes"
              else
                echo "Manually triggered release for version ${current_version} from the ${branch} branch."
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${{ github.event.before }}:package.json" 2>/dev/null; then
            previous_version="$(git show "${{ github.event.before }}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          else
            previous_version=""
          fi

          # No readable previous version means we cannot tell a bump from an
          # ordinary push, so we do not release. A genuine bump that lands
          # here is recovered with a workflow_dispatch; the opposite mistake
          # overwrites a published release.
          if [[ -z "$previous_version" ]]; then
            echo "::warning::Could not read package.json at ${{ github.event.before }}; not releasing."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$previous_version" == "${current_version}" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_label}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<EOF"
            if [[ "$has_changelog_notes" == "true" ]]; then
              printf '%s\n' "$changelog_notes"
            else
              echo "Automated release for version ${current_version} from the ${branch} branch."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        if: steps.version.outputs.should_release == 'true' && !inputs.force && !inputs.dry_run
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }

            if (release.data.draft) {
              core.info(`${tag} exists as a draft; publishing over it is fine.`);
              return;
            }

            core.setFailed(
              `${tag} is already published at ${release.data.html_url}. Publishing ` +
              `would overwrite its notes and assets with freshly built ones. If ` +
              `that is genuinely what you want, re-run from the Actions tab with ` +
              `the "force" input enabled.`);

  # Each platform builds and publishes on its own, in priority order:
  # Windows first, then Linux, then macOS. A platform publishes as soon as
  # its own build is done, and a failure in one does not hold back the others.
  build-windows:
    name: Build Windows
    # x64, plus 32-bit Windows with the static C runtime (.cargo/config.toml),
    # NSIS only, without the x64 Visual C++ prerequisite (tauri.windows-x86.conf.json).
    needs:
      - detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true'
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      matrix: >-
        [{"platform": "windows-latest", "build_kind": "tauri", "args": "--target x86_64-pc-windows-msvc --bundles nsis,msi", "artifact_name": "rambutan-windows-x64", "windows_triple": "x86_64-pc-windows-msvc", "windows_arch": "x64"}, {"platform": "windows-latest", "build_kind": "tauri", "args": "--target i686-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-x86.conf.json", "artifact_name": "rambutan-windows-x86", "df_build_triple": "i686-pc-windows-msvc", "windows_triple": "i686-pc-windows-msvc", "windows_arch": "x86"}]

  build-linux:
    name: Build Linux
    needs:
      - detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true'
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      matrix: >-
        [{"platform": "ubuntu-22.04", "build_kind": "flatpak", "artifact_name": "rambutan-linux-flatpak-x64"}]

  build-macos:
    name: Build macOS
    needs:
      - detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true'
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/release-build.yml
    secrets: inherit
    with:
      matrix: >-
        [{"platform": "macos-latest", "build_kind": "tauri", "args": "--target universal-apple-darwin --bundles app,dmg", "artifact_name": "rambutan-macos-universal", "cmake_archs": "arm64;x86_64", "df_build_triple": "universal-apple-darwin"}]

  release-notes:
    name: Release notes
    needs:
      - detect-version-bump
    if: needs.detect-version-bump.outputs.should_release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.final_notes.outputs.body }}
    steps:
      - name: Resolve release notes from matching prerelease
        id: release_notes
        if: |
          github.ref_name == 'main' &&
          needs.detect-version-bump.outputs.has_prerelease_suffix == 'false'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          FALLBACK_BODY: ${{ needs.detect-version-bump.outputs.release_body }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.VERSION;
            // Same X.Y.Z, any prerelease identifier: v0.2.0-rc.1, v0.2.0-rc.2, v0.2.0-beta...
            const prefix = `v${version}-`;
            let body = process.env.FALLBACK_BODY || "";

            try {
              const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
              const candidates = releases
                .filter((r) => r.tag_name.startsWith(prefix) && r.body?.trim())
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (candidates.length > 0) {
                body = candidates[0].body;
                core.info(`Using hand-written notes from prerelease ${candidates[0].tag_name}`);
              } else {
                core.warning(`No prerelease found matching ${prefix}*; using fallback notes.`);
              }
            } catch (error) {
              core.warning(`Failed listing releases: ${error.message}; using fallback notes.`);
            }

            core.setOutput("body", body);

      - name: Add the per-platform downloads and notices to the release notes
        id: final_notes
        uses: actions/github-script@v9
        env:
          NOTES: ${{ steps.release_notes.outputs.body || needs.detect-version-bump.outputs.release_body }}
        with:
          script: |
            // Downloads and notices in priority order: Windows, then Linux, then macOS.
            // Only the Windows x64 installer has been run by the maintainer; Linux is
            // not tested yet and nobody on the project can run the macOS build.
            const notice = [
              "## Downloads para Windows",
              "",
              "| Arquivo | O que é |",
              "| --- | --- |",
              "| `Rambutan Slicer_<versão>_x64-setup.exe` | Instalador para Windows 64 bits. **É o único testado.** |",
              "| `Rambutan Slicer_<versão>_x86-setup.exe` | Instalador para Windows 32 bits. Não testado. |",
              "| `Rambutan-Slicer_<versão>_x64.exe` / `_x86.exe` | Só o executável, sem instalar. Não testado. |",
              "| `Rambutan-Slicer_<versão>_x64_portable.zip` / `_x86_portable.zip` | Versão portable: extraia e rode. Inclui licença e avisos de terceiros. Não testado. |",
              "",
              "⚠️ **Windows x86 (32 bits) e versões portable/executável: não testados.** Foram só compilados pelo CI. O executável e o portable x64 precisam do Microsoft Visual C++ Redistributable x64 (o instalador x64 instala para você); os de 32 bits já trazem o runtime embutido. Todos precisam do WebView2, que já vem no Windows 10 e 11. Em 32 bits o programa tem no máximo 2 a 4 GB de memória, então modelos muito grandes podem falhar.",
              "",
              "⚠️ **Windows x86 (32-bit) and the portable/standalone builds: untested.** They only compile in CI. The x64 standalone and portable builds need the Microsoft Visual C++ Redistributable x64 (the x64 installer sets it up for you); the 32-bit ones carry the runtime inside. All of them need WebView2, which ships with Windows 10 and 11. A 32-bit process is limited to 2–4 GB of memory, so very large models may fail.",
              "",
              "---",
              "",
              "## Downloads para Linux",
              "",
              "| Arquivo | O que é |",
              "| --- | --- |",
              "| `rambutan-slicer-<versão>-x86_64.flatpak` | Pacote Flatpak para Linux 64 bits. Ainda não testado. |",
              "",
              "⚠️ **Linux: ainda não testado.** O Flatpak é compilado pelo CI, mas ainda não foi executado. Relate o resultado numa issue.",
              "",
              "⚠️ **Linux: not tested yet.** The Flatpak is built in CI but has not been run yet. Please report what you find in an issue.",
              "",
              "---",
              "",
              "## Downloads para macOS",
              "",
              "| Arquivo | O que é |",
              "| --- | --- |",
              "| `Rambutan.Slicer_<versão>_universal.dmg` | Imagem de disco para macOS (Intel e Apple Silicon). Não testado. |",
              "| `Rambutan.Slicer.app.tar.gz` | O app compactado, sem imagem de disco. Não testado. |",
              "",
              "⚠️ **macOS: não testado.** A versão para macOS só é compilada pelo CI e nunca foi executada em um Mac. Use por sua conta e risco e relate o resultado numa issue.",
              "",
              "⚠️ **macOS: untested.** The macOS build only compiles in CI; it has never been run on a Mac. Use it at your own risk and report what you find in an issue.",
            ].join("\n");
            core.setOutput("body", `${(process.env.NOTES || "").trimEnd()}\n\n---\n\n${notice}\n`);


  publish-windows:
    name: Publish Windows
    needs:
      - detect-version-bump
      - release-notes
      - build-windows
    if: always() && !cancelled() && needs.detect-version-bump.outputs.should_release == 'true' && !inputs.dry_run && needs.release-notes.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      INCLUDE_DARWIN: false
    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: rambutan-windows-*

      # Each build job uploads its import report as VERIFICACAO-<platform>.md,
      # and both Windows jobs say win32: two assets with one name make the
      # upload fail. Name each report after its build instead.
      - name: Give each import report a unique name
        shell: bash
        run: |
          for f in release-assets/*-import-verification/VERIFICACAO-*.md; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            build=$(basename "$dir"); build=${build%-import-verification}; build=${build#rambutan-}
            [ "$f" = "$dir/VERIFICACAO-$build.md" ] || mv "$f" "$dir/VERIFICACAO-$build.md"
          done
          find release-assets -type f -printf '%f\n' | sort | uniq -d | grep . && { echo "::error::duplicate asset names"; exit 1; } || true

      - name: Generate updater JSON
        if: needs.detect-version-bump.outputs.publish_updater_json == 'true'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
          UPDATER_JSON: ${{ needs.detect-version-bump.outputs.updater_json }}
          INCLUDE_DARWIN: ${{ env.INCLUDE_DARWIN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const version = process.env.VERSION;
            const tag = process.env.TAG_NAME;
            const jsonFile = process.env.UPDATER_JSON;
            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`;

            function findOne(pattern) {
              const results = execSync(`find release-assets updater-inputs -name "${pattern}" 2>/dev/null || true`).toString().trim().split('\n').filter(Boolean);
              if (results.length === 0) throw new Error(`No file matching ${pattern} in release-assets`);
              if (results.length > 1) throw new Error(`Multiple files matching ${pattern}: ${results.join(', ')}`);
              return results[0];
            }

            // The x64 NSIS installer feeds the updater; the x86 installer and the
            // standalone/portable files are download-only. The Windows publish
            // writes the feed with Windows only; the macOS publish rewrites it
            // with both platforms.
            const windowsZip = findOne('*_x64-setup.exe');
            const windowsSig = findOne('*_x64-setup.exe.sig');
            const platforms = {
              'windows-x86_64': {
                url: `${baseUrl}/${path.basename(windowsZip)}`,
                signature: fs.readFileSync(windowsSig, 'utf8').trim(),
              },
            };
            if (process.env.INCLUDE_DARWIN === 'true') {
              const darwinTgz = findOne('*.app.tar.gz');
              const darwinSig = findOne('*.app.tar.gz.sig');
              platforms['darwin-universal'] = {
                url: `${baseUrl}/${path.basename(darwinTgz)}`,
                signature: fs.readFileSync(darwinSig, 'utf8').trim(),
              };
            }

            const json = { version, pub_date: new Date().toISOString(), platforms };

            fs.writeFileSync(jsonFile, JSON.stringify(json, null, 2));
            core.info(`Generated ${jsonFile}:\n${JSON.stringify(json, null, 2)}`);

      - name: Create tag if needed
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const ref = `refs/tags/${tag}`;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
            }

      - name: Publish the Windows packages to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag_name }}
          name: ${{ needs.detect-version-bump.outputs.release_name }}
          body: ${{ needs.release-notes.outputs.body }}
          prerelease: ${{ needs.detect-version-bump.outputs.is_prerelease }}
          draft: false
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/**/*
            ${{ needs.detect-version-bump.outputs.publish_updater_json == 'true' && needs.detect-version-bump.outputs.updater_json || '' }}

  publish-linux:
    name: Publish Linux
    needs:
      - detect-version-bump
      - release-notes
      - build-linux
      - publish-windows
    if: always() && !cancelled() && needs.detect-version-bump.outputs.should_release == 'true' && !inputs.dry_run && needs.release-notes.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: rambutan-linux-*

      # Each build job uploads its import report as VERIFICACAO-<platform>.md,
      # and both Windows jobs say win32: two assets with one name make the
      # upload fail. Name each report after its build instead.
      - name: Give each import report a unique name
        shell: bash
        run: |
          for f in release-assets/*-import-verification/VERIFICACAO-*.md; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            build=$(basename "$dir"); build=${build%-import-verification}; build=${build#rambutan-}
            [ "$f" = "$dir/VERIFICACAO-$build.md" ] || mv "$f" "$dir/VERIFICACAO-$build.md"
          done
          find release-assets -type f -printf '%f\n' | sort | uniq -d | grep . && { echo "::error::duplicate asset names"; exit 1; } || true

      - name: Create tag if needed
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const ref = `refs/tags/${tag}`;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
            }

      - name: Publish the Linux packages to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag_name }}
          name: ${{ needs.detect-version-bump.outputs.release_name }}
          body: ${{ needs.release-notes.outputs.body }}
          prerelease: ${{ needs.detect-version-bump.outputs.is_prerelease }}
          draft: false
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/**/*

  publish-macos:
    name: Publish macOS
    needs:
      - detect-version-bump
      - release-notes
      - build-macos
      - publish-linux
      - build-windows
    if: always() && !cancelled() && needs.detect-version-bump.outputs.should_release == 'true' && !inputs.dry_run && needs.release-notes.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    env:
      INCLUDE_DARWIN: true
    steps:
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: rambutan-macos-*

      - name: Download the Windows x64 updater files
        if: needs.detect-version-bump.outputs.publish_updater_json == 'true'
        uses: actions/download-artifact@v8
        with:
          path: updater-inputs
          name: rambutan-windows-x64

      # Each build job uploads its import report as VERIFICACAO-<platform>.md,
      # and both Windows jobs say win32: two assets with one name make the
      # upload fail. Name each report after its build instead.
      - name: Give each import report a unique name
        shell: bash
        run: |
          for f in release-assets/*-import-verification/VERIFICACAO-*.md; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            build=$(basename "$dir"); build=${build%-import-verification}; build=${build#rambutan-}
            [ "$f" = "$dir/VERIFICACAO-$build.md" ] || mv "$f" "$dir/VERIFICACAO-$build.md"
          done
          find release-assets -type f -printf '%f\n' | sort | uniq -d | grep . && { echo "::error::duplicate asset names"; exit 1; } || true

      - name: Generate updater JSON
        # Needs the Windows x64 build too, for its half of the feed.
        if: needs.detect-version-bump.outputs.publish_updater_json == 'true' && needs.build-windows.result == 'success'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
          UPDATER_JSON: ${{ needs.detect-version-bump.outputs.updater_json }}
          INCLUDE_DARWIN: ${{ env.INCLUDE_DARWIN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const version = process.env.VERSION;
            const tag = process.env.TAG_NAME;
            const jsonFile = process.env.UPDATER_JSON;
            const baseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}`;

            function findOne(pattern) {
              const results = execSync(`find release-assets updater-inputs -name "${pattern}" 2>/dev/null || true`).toString().trim().split('\n').filter(Boolean);
              if (results.length === 0) throw new Error(`No file matching ${pattern} in release-assets`);
              if (results.length > 1) throw new Error(`Multiple files matching ${pattern}: ${results.join(', ')}`);
              return results[0];
            }

            // The x64 NSIS installer feeds the updater; the x86 installer and the
            // standalone/portable files are download-only. The Windows publish
            // writes the feed with Windows only; the macOS publish rewrites it
            // with both platforms.
            const windowsZip = findOne('*_x64-setup.exe');
            const windowsSig = findOne('*_x64-setup.exe.sig');
            const platforms = {
              'windows-x86_64': {
                url: `${baseUrl}/${path.basename(windowsZip)}`,
                signature: fs.readFileSync(windowsSig, 'utf8').trim(),
              },
            };
            if (process.env.INCLUDE_DARWIN === 'true') {
              const darwinTgz = findOne('*.app.tar.gz');
              const darwinSig = findOne('*.app.tar.gz.sig');
              platforms['darwin-universal'] = {
                url: `${baseUrl}/${path.basename(darwinTgz)}`,
                signature: fs.readFileSync(darwinSig, 'utf8').trim(),
              };
            }

            const json = { version, pub_date: new Date().toISOString(), platforms };

            fs.writeFileSync(jsonFile, JSON.stringify(json, null, 2));
            core.info(`Generated ${jsonFile}:\n${JSON.stringify(json, null, 2)}`);

      - name: Create tag if needed
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const ref = `refs/tags/${tag}`;

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref, sha: context.sha });
            }

      - name: Publish the macOS packages to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag_name }}
          name: ${{ needs.detect-version-bump.outputs.release_name }}
          body: ${{ needs.release-notes.outputs.body }}
          prerelease: ${{ needs.detect-version-bump.outputs.is_prerelease }}
          draft: false
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/**/*
            ${{ needs.detect-version-bump.outputs.publish_updater_json == 'true' && needs.detect-version-bump.outputs.updater_json || '' }}

  label-dev-fixes:
    name: Label issues fixed in dev
    needs:
      - detect-version-bump
      - publish-windows
    # A final (no -suffix) version on dev is the "train" passing a station:
    # every issue closed by a commit since the last final dev release gets
    # labeled instead of closed, since dev isn't the default branch and
    # GitHub only auto-closes issues for commits that land on that one.
    if: |
      needs.detect-version-bump.outputs.should_release == 'true' &&
      github.ref_name == 'dev' &&
      needs.detect-version-bump.outputs.has_prerelease_suffix == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find previous dev release tag
        id: prev_tag
        run: |
          current_tag="${{ needs.detect-version-bump.outputs.tag_name }}"
          prev_tag="$(git tag --list 'v*' --merged HEAD | grep -v "^${current_tag}\$" | sort -V | tail -n1)"
          echo "prev_tag=${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Label issues closed since previous dev release
        uses: actions/github-script@v9
        env:
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          LABEL_NAME: "fixed in dev"
          VERSION: ${{ needs.detect-version-bump.outputs.version }}
          TAG_NAME: ${{ needs.detect-version-bump.outputs.tag_name }}
        with:
          script: |
            const { execSync } = require('child_process');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = process.env.LABEL_NAME;
            const version = process.env.VERSION;
            const tag = process.env.TAG_NAME;
            const range = process.env.PREV_TAG ? `${process.env.PREV_TAG}..HEAD` : 'HEAD';

            const releaseUrl = `https://github.com/${owner}/${repo}/releases/tag/${tag}`;
            // dev only ships odd MINORs (see docs/dev/releases.md); the next
            // stable is the following even MINOR, .0 patch — a naming guess,
            // not a promise, since the actual promotion date isn't known yet.
            const [major, minor] = version.split('.').map(Number);
            const nextStable = `${major}.${minor + 1}.0`;
            const commentBody = [
              `A fix for this issue has been included in development version \`v${version}\`, ` +
                `available for download here: ${releaseUrl} — this is a \`dev\`-line build, offered without any guarantees.`,
              '',
              `It should ship as part of a stable release (tentatively \`v${nextStable}\`, naming not final) ` +
                'within the next few days to weeks, depending on the release cadence.',
            ].join('\n');

            const log = execSync(`git log ${range} --pretty=format:%B%x00`, { maxBuffer: 1024 * 1024 * 32 }).toString();

            // Same closing-keyword grammar GitHub uses: a keyword followed by
            // one or more #NNN references (comma/"and"-separated).
            const closingRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b((?:\s*,?\s*(?:and\s+)?#\d+)+)/gi;
            const issueRe = /#(\d+)/g;

            const issueNumbers = new Set();
            let match;
            while ((match = closingRe.exec(log)) !== null) {
              let issueMatch;
              while ((issueMatch = issueRe.exec(match[1])) !== null) {
                issueNumbers.add(Number(issueMatch[1]));
              }
            }

            if (issueNumbers.size === 0) {
              core.info('No closing references found in this range; nothing to label.');
              return;
            }

            core.info(`Found closing references to: ${[...issueNumbers].join(', ')}`);

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Label "${label}" does not exist yet; creating it.`);
              await github.rest.issues.createLabel({ owner, repo, name: label, color: '5319e7' });
            }

            for (const issueNumber of issueNumbers) {
              let issue;
              try {
                issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              } catch (error) {
                core.warning(`#${issueNumber}: could not fetch (${error.message}); skipping.`);
                continue;
              }

              if (issue.data.pull_request) {
                core.info(`#${issueNumber} is a pull request, not an issue; skipping.`);
                continue;
              }

              if (issue.data.labels.some((l) => (typeof l === 'string' ? l : l.name) === label)) {
                core.info(`#${issueNumber}: already labeled "${label}"; skipping (no duplicate comment).`);
                continue;
              }

              await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [label] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: commentBody });
              core.info(`#${issueNumber}: labeled "${label}" and commented.`);
            }
