name: Release build

# The build steps of release.yml, called once per platform (Windows, then
# Linux, then macOS) so that each platform is published on its own as soon as
# its packages are ready, without waiting for the others.
on:
  workflow_call:
    inputs:
      matrix:
        description: JSON list of matrix entries (platform, build_kind, args, artifact_name, ...).
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  build-tauri:
    name: Build ${{ matrix.artifact_name }}
    # The shipped profile, stated here as well as in Cargo.toml so that
    # `swatinem/rust-cache` keys on it (see `env-vars` below): the compile check
    # links thin and keeps its artifacts under a different key.
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # The matrix already carries these per platform; they are stated at job level
      # so `swatinem/rust-cache` sees them (see `env-vars`) and a macOS release reads
      # the same cache the warmer writes.
      CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_archs || '' }}
      DF_BUILD_TARGET_TRIPLE: ${{ matrix.df_build_triple || '' }}
      # Signing is optional on this fork: without these secrets the build is
      # unsigned (ad-hoc on macOS, see tauri.macos.conf.json) and not notarized.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm

      # Pinned, not `@stable`: the floating channel is what churns the Rust cache
      # key (see warm-rust-cache.yml).
      - name: Read the pinned Rust toolchain
        id: rust_toolchain
        # bash, not the runner's default shell: Windows would run this as pwsh,
        # where `$(sed …)` is a module path, and the step died there.
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.windows_triple || '' }}

      - name: Install Apple Certificate
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_SIGNING == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASS }}

      # Credentials are exported only when present. An empty variable is still a
      # set variable, and Tauri would try to sign or notarize with a blank value.
      - name: Export signing credentials that exist
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "$HAS_APPLE_SIGNING" == "true" ]]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          fi
          if [[ "$RUNNER_OS" == "macOS" && "$HAS_APPLE_NOTARY" == "true" ]]; then
            {
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
            } >> "$GITHUB_ENV"
          fi
          if [[ "$HAS_UPDATER_KEY" == "true" ]]; then
            {
              echo "TAURI_SIGNING_PRIVATE_KEY=$TAURI_KEY_SECRET"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
          fi
          echo "Apple signing: $HAS_APPLE_SIGNING · notarization: $HAS_APPLE_NOTARY · updater key: $HAS_UPDATER_KEY"

      # `swatinem/rust-cache` hashes every toolchain `rustup` lists, not only the
      # one the build uses, and the runner image ships its own `stable` (1.98.1
      # when this was written). Pinning the channel alone left the key to move
      # whenever the image moved that one; removing the rest leaves the pinned
      # toolchain as the only Rust input to the key.
      - name: Drop the runner's other Rust toolchains
        shell: bash
        env:
          PINNED: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          rustup default "$PINNED"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in
              # `system` is a rustc outside rustup, which rustup cannot remove.
              "$PINNED"-* | system) ;;
              *) rustup toolchain uninstall "$tc" || echo "::warning::could not uninstall $tc" ;;
            esac
          done
          rustup toolchain list

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./rust/dragonfruit-voxl-thumbnail -> target
          shared-key: tauri
          # The profile and the target are part of the artifacts, so they are part
          # of the key: without this the job restores a cache built the other way,
          # cannot reuse any of it, and skips saving its own.
          env-vars: CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS DF_BUILD_TARGET_TRIPLE CMAKE_OSX_ARCHITECTURES

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for release import verification
        if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium

      - name: Install Chromium for release import verification (macOS)
        if: runner.os == 'macOS'
        run: npx playwright-core install chromium

      # Next asks for this on every run ("No build cache found"): its compiler and
      # fetch caches live in `.next/cache`, and restoring that across runs is worth
      # a minute or two of each frontend build. Keyed on the lockfile and the
      # sources, with a prefix restore so a commit that changes sources still
      # reuses what it can, which is most of it.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      # build-thumbnail-providers.mjs builds the COM DLL with `--target` only
      # when CARGO_BUILD_TARGET is set. Exported for x86 alone (an empty value
      # would reach cargo too), so the x64 build keeps its tested path.
      - name: Target the COM DLL and C++ dependencies at 32-bit Windows
        if: matrix.windows_arch == 'x86'
        shell: bash
        run: |
          echo "CARGO_BUILD_TARGET=${{ matrix.windows_triple }}" >> "$GITHUB_ENV"
          # manifold-csg-sys calls cmake itself; without this it builds x64 /MD
          # libraries that the i686 static-CRT link rejects.
          echo "CMAKE_GENERATOR_PLATFORM=Win32" >> "$GITHUB_ENV"
          echo "CMAKE_TOOLCHAIN_FILE=$(cygpath -m "$GITHUB_WORKSPACE")/scripts/cmake/windows-x86-static-crt.cmake" >> "$GITHUB_ENV"

      - name: Build Tauri bundle
        if: matrix.build_kind == 'tauri'
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_archs || '' }}
          DF_BUILD_TARGET_TRIPLE: ${{ matrix.df_build_triple || '' }}
          # Signing and notarization credentials come from the export step above.
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Verify Windows installer runtime payloads
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_TRIPLE: ${{ matrix.windows_triple }}
        run: |
          $bundle = "src-tauri/target/$env:WINDOWS_TRIPLE/release/bundle"
          if ($env:WINDOWS_TRIPLE -eq 'i686-pc-windows-msvc') {
            ./scripts/verify-windows-bundles.ps1 -BundleDirectory $bundle -Formats nsis -StaticRuntime
          } else {
            ./scripts/verify-windows-bundles.ps1 -BundleDirectory $bundle
          }

      # The standalone executable and the portable zip are cut from the same
      # build as the installer: Tauri embeds the frontend in the .exe, so it runs
      # from any folder. See scripts/package-windows-portable.ps1.
      - name: Package Windows executable and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_TRIPLE: ${{ matrix.windows_triple }}
          WINDOWS_ARCH: ${{ matrix.windows_arch }}
        run: ./scripts/package-windows-portable.ps1 -Triple $env:WINDOWS_TRIPLE -Arch $env:WINDOWS_ARCH -OutputDirectory release-portable

      - name: Embed QuickLook extension + verify universal bundle
        if: matrix.platform == 'macos-latest'
        # Notarizes the DMG when the export step provided Apple credentials;
        # otherwise the script leaves it signed (ad-hoc) and not notarized.
        run: |
          node scripts/macos-embed-appex.mjs --target ${{ matrix.df_build_triple }}
          node scripts/verify-universal-bundle.mjs

      - name: Install AppStream + desktop-file validators
        if: matrix.build_kind == 'flatpak'
        run: sudo apt-get install -y appstream desktop-file-utils

      - name: Install Flatpak build tooling
        if: matrix.build_kind == 'flatpak'
        run: sudo apt-get install -y flatpak flatpak-builder

      - name: Prepare XDG runtime directory
        if: matrix.build_kind == 'flatpak'
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"

      - name: Configure Flathub remote
        if: matrix.build_kind == 'flatpak'
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime dependencies (user)
        if: matrix.build_kind == 'flatpak'
        run: |
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Platform//24.08

      - name: Build Tauri app (CEF variant on Linux)
        if: matrix.build_kind == 'flatpak'
        run: node scripts/tauri-build.mjs --target x86_64-unknown-linux-gnu --no-bundle

      - name: Upload macOS installer + updater artifacts
        if: matrix.build_kind == 'tauri' && matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows installer + updater artifacts
        if: matrix.build_kind == 'tauri' && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/*/release/bundle/nsis/*
            release-portable/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload flatpak artifact
        if: matrix.build_kind == 'flatpak'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 3

      - name: Upload import verification and guide
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-import-verification
          path: release-verification/VERIFICACAO-*.md
          if-no-files-found: error
          retention-days: 30

